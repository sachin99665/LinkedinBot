services:
  - type: web
    name: linkedin-bot
    runtime: python3
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        required: true
      - key: GROQ_API_KEY
        required: false
      - key: LINKEDIN_ACCESS_TOKEN
        required: false