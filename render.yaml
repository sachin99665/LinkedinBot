services:
  - type: web
    name: python-builder-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true